# ─────────────────────────────────────────────────────────────
# Netlify configuration for El Balconet
# ─────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

# ── Next.js runtime plugin (required for SSR on Netlify) ──
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Force HTTPS: redirect all HTTP traffic to HTTPS ──
[[redirects]]
  from       = "http://elbalconet.es/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

[[redirects]]
  from       = "http://www.elbalconet.es/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

# ── www → apex redirect ──
[[redirects]]
  from       = "https://www.elbalconet.es/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

# ── Redirect old domain to new domain ──
[[redirects]]
  from       = "https://elbalconet.com/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

[[redirects]]
  from       = "http://elbalconet.com/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

[[redirects]]
  from       = "https://www.elbalconet.com/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

[[redirects]]
  from       = "http://www.elbalconet.com/*"
  to         = "https://elbalconet.es/:splat"
  status     = 301
  force      = true

# ── Security & caching headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy    = "upgrade-insecure-requests;"

# Static assets — cache 1 year (fingerprinted by Next.js)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimised images — cache 1 week
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Public API — short cache with stale-while-revalidate
[[headers]]
  for = "/api/public/*"
  [headers.values]
    Cache-Control = "public, s-maxage=60, stale-while-revalidate=30"
